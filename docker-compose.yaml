services:
  rust:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_VERSION: ${RUST_VERSION:-1-slim}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        INSTALL_CARGO_WATCH: ${INSTALL_CARGO_WATCH:-false}
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APP_PORT: ${APP_PORT:-8080}
      CARGO_CMD: ${CARGO_CMD:-/usr/local/cargo/bin/cargo run}
    ports:
      - "${HOST_PORT:-8080}:${APP_PORT:-8080}"
    command: >
      /bin/bash -lc "${CARGO_CMD:-/usr/local/cargo/bin/cargo run}"
    init: true
    restart: unless-stopped

volumes:
  cargo-registry: {}
  cargo-git: {}
  cargo-target: {}
